[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dropcurve"
version = "0.1.0"
description = "Find where listeners drop off in serialized audio, and what that means for the paywall"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
